<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - Flit</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 80%, #0a1628 0%, #030810 100%);
      color: #e8edf5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .card {
      width: min(100%, 420px);
      padding: 32px 28px;
      border: 1px solid #1e293b;
      border-radius: 18px;
      background: linear-gradient(180deg, #0f1a2e 0%, #0a1225 100%);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.15;
    }

    p {
      margin: 0 0 20px;
      color: #94a3b8;
      line-height: 1.5;
    }

    form {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #334155;
      border-radius: 12px;
      background: #08101f;
      color: #e8edf5;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
    }

    button {
      margin-top: 6px;
      padding: 14px 16px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .status {
      min-height: 22px;
      margin: 0 0 18px;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.error { color: #fca5a5; }
    .status.success { color: #86efac; }
    .muted { color: #64748b; font-size: 13px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Set a new password</h1>
    <p>Choose a new password for your Flit account, then head back to the app and sign in.</p>
    <p id="status" class="status" aria-live="polite"></p>
    <form id="reset-form" novalidate>
      <label>
        New password
        <input id="password" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <label>
        Confirm password
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <button id="submit-button" type="submit">Update password</button>
    </form>
    <p class="muted">Reset links expire. If this page says the link is invalid or expired, request a fresh reset email from Flit.</p>
  </main>

  <script>
    const SUPABASE_URL = 'https://zrffgpkscdaybfhujioc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_AnlV4Gngx7a5z3KwqV7F9w_-4rQYEJs';

    const statusEl = document.getElementById('status');
    const formEl = document.getElementById('reset-form');
    const passwordEl = document.getElementById('password');
    const confirmPasswordEl = document.getElementById('confirm-password');
    const submitButtonEl = document.getElementById('submit-button');

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function parseParams() {
      const search = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      return {
        accessToken: hash.get('access_token') || search.get('access_token'),
        error:
          hash.get('error_description') ||
          search.get('error_description') ||
          hash.get('error') ||
          search.get('error'),
      };
    }

    const params = parseParams();

    if (params.error) {
      setStatus(decodeURIComponent(params.error.replace(/\+/g, ' ')), 'error');
      formEl.classList.add('hidden');
    } else if (!params.accessToken) {
      setStatus('This reset link is invalid or expired. Request a new password reset email from Flit.', 'error');
      formEl.classList.add('hidden');
    }

    formEl.addEventListener('submit', async (event) => {
      event.preventDefault();

      const password = passwordEl.value;
      const confirmPassword = confirmPasswordEl.value;

      if (password.length < 6) {
        setStatus('Password must be at least 6 characters.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        setStatus('Passwords do not match.', 'error');
        return;
      }

      submitButtonEl.disabled = true;
      setStatus('Updating password…');

      try {
        const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            apikey: SUPABASE_ANON_KEY,
            Authorization: 'Bearer ' + params.accessToken,
          },
          body: JSON.stringify({ password }),
        });

        const payload = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(
            payload.msg ||
            payload.error_description ||
            payload.error ||
            'Password reset failed.'
          );
        }

        setStatus('Password updated. Return to Flit and sign in with your new password.', 'success');
        formEl.classList.add('hidden');
      } catch (err) {
        setStatus(err && err.message ? err.message : 'Password reset failed.', 'error');
        submitButtonEl.disabled = false;
      }
    });
  </script>
</body>
</html>
